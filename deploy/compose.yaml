name: network-atlas

services:
  app:
    image: ${APP_IMAGE:-network-atlas:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    stop_grace_period: 35s
    environment:
      NETWORK_ATLAS_BIND: 0.0.0.0:8787
      NETWORK_ATLAS_DATA_DIR: /var/lib/network-atlas
      NETWORK_ATLAS_DATABASE_URL: sqlite:///var/lib/network-atlas/network-atlas.db?mode=rwc
      NETWORK_ATLAS_FRONTEND_DIR: /opt/network-atlas/frontend
      NETWORK_ATLAS_AUTH_MODE: required
      NETWORK_ATLAS_OWNER_USERNAME: ${OWNER_USERNAME:-owner}
      NETWORK_ATLAS_OWNER_PASSWORD_HASH_FILE: /run/secrets/owner_password_hash
      NETWORK_ATLAS_ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      NETWORK_ATLAS_COOKIE_SECURE: "true"
      NETWORK_ATLAS_SESSION_HOURS: ${SESSION_HOURS:-12}
      NETWORK_ATLAS_LOGIN_LIMIT_PER_MINUTE: ${LOGIN_LIMIT_PER_MINUTE:-5}
      NETWORK_ATLAS_WRITE_LIMIT_PER_MINUTE: ${WRITE_LIMIT_PER_MINUTE:-120}
      NETWORK_ATLAS_MONITOR_MAX_CONCURRENCY: ${MONITOR_MAX_CONCURRENCY:-1}
      NETWORK_ATLAS_MONITOR_TICK_SECONDS: ${MONITOR_TICK_SECONDS:-5}
      NETWORK_ATLAS_MONITOR_COMPACTOR_TICK_SECONDS: ${MONITOR_COMPACTOR_TICK_SECONDS:-3600}
      NETWORK_ATLAS_MONITOR_COMPACTOR_PARTITIONS_PER_TICK: ${MONITOR_COMPACTOR_PARTITIONS_PER_TICK:-32}
      NETWORK_ATLAS_MONITOR_RETENTION_ENABLED: ${MONITOR_RETENTION_ENABLED:-false}
      NETWORK_ATLAS_MONITOR_RETENTION_DELETE_BATCH_SIZE: ${MONITOR_RETENTION_DELETE_BATCH_SIZE:-5000}
      NETWORK_ATLAS_MONITOR_RAW_OBSERVED_RETENTION_DAYS: ${MONITOR_RAW_OBSERVED_RETENTION_DAYS:-7}
      NETWORK_ATLAS_MONITOR_RAW_NON_OBSERVED_RETENTION_DAYS: ${MONITOR_RAW_NON_OBSERVED_RETENTION_DAYS:-30}
      NETWORK_ATLAS_MONITOR_HOUR_RETENTION_DAYS: ${MONITOR_HOUR_RETENTION_DAYS:-90}
      NETWORK_ATLAS_MONITOR_DAY_RETENTION_DAYS: ${MONITOR_DAY_RETENTION_DAYS:-365}
      RUST_LOG: ${RUST_LOG:-network_atlas=info}
    secrets:
      - source: owner_password_hash
        target: owner_password_hash
        uid: "11001"
        gid: "11001"
        mode: 0400
    volumes:
      - network_atlas_data:/var/lib/network-atlas
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8787/healthz"]
      interval: 15s
      timeout: 4s
      retries: 8
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

secrets:
  owner_password_hash:
    file: ./secrets/owner_password_hash.txt

volumes:
  network_atlas_data:
    name: network-atlas-data
  caddy_data:
    name: network-atlas-caddy-data
  caddy_config:
    name: network-atlas-caddy-config

networks:
  internal:
    driver: bridge
